[project]
name = "exoms"
version = "0.1.0"
description = "Demo FIX order management system for ElectronX (market data, order entry, drop copy)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
exoms = "exoms.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exoms*"]
